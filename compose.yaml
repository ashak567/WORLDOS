services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: worldos
      POSTGRES_USER: worldos
      POSTGRES_PASSWORD: worldos_dev_only
    ports:
      - "5432:5432"
    volumes:
      - worldos-postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldos -d worldos"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env.local
        required: false
    environment:
      WORLDOS_DATABASE_URL: postgresql://worldos:worldos_dev_only@postgres:5432/worldos
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}
      NASA_FIRMS_MAP_KEY: ${NASA_FIRMS_MAP_KEY:-}
      WORLDOS_PUBLIC_READ_ONLY: ${WORLDOS_PUBLIC_READ_ONLY:-false}
      WORLDOS_CORS_ORIGINS: ${WORLDOS_CORS_ORIGINS:-*}
      WORLDOS_ENABLE_ASSISTANT: ${WORLDOS_ENABLE_ASSISTANT:-true}
      WORLDOS_RUN_MIGRATIONS_ON_START: ${WORLDOS_RUN_MIGRATIONS_ON_START:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./db/init:/app/db/init:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  worldos-postgres:

